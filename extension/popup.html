<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobAgent Autofill</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #16181d; --ink-2: #4a5160; --ink-3: #767f91;
    --surface: #fff; --surface-2: #f0f2f6; --line: #dfe3ea; --line-2: #c9cfda;
    --accent: #1f5fd0; --accent-ink: #fff; --accent-bg: #e8effc;
    --good: #0f7a52; --good-bg: #e2f4ec; --warn: #8a5a00; --warn-bg: #fdf0d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8eaf0; --ink-2: #a4adbe; --ink-3: #737d90;
      --surface: #171a20; --surface-2: #1e222a; --line: #272c36; --line-2: #363d4a;
      --accent: #6699f5; --accent-ink: #0b1220; --accent-bg: #17253f;
      --good: #4cc493; --good-bg: #123227; --warn: #d9a441; --warn-bg: #33270f;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 296px; margin: 0; padding: 14px;
    background: var(--surface); color: var(--ink);
    font: 400 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .top { display: flex; align-items: baseline; gap: 7px; margin-bottom: 3px; }
  h1 { margin: 0; font-size: 13.5px; font-weight: 640; letter-spacing: -.01em; }
  .host {
    font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sub { margin: 0 0 12px; font-size: 11.5px; color: var(--ink-3); }

  button {
    width: 100%; height: 34px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font: 600 13px inherit;
    color: var(--accent-ink); background: var(--accent);
    border: 1px solid var(--accent); border-radius: 6px;
    cursor: pointer; transition: background .12s ease;
  }
  button:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, #000); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost {
    margin-top: 7px; height: 30px; font-weight: 500; font-size: 12px;
    color: var(--ink-2); background: var(--surface); border-color: var(--line-2);
  }
  button.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }

  #msg {
    margin-top: 11px; padding: 9px 10px;
    font-size: 12px; line-height: 1.45;
    border-radius: 6px; background: var(--surface-2); color: var(--ink-2);
  }
  #msg.ok   { background: var(--good-bg); color: var(--good); }
  #msg.warn { background: var(--warn-bg); color: var(--warn); }
  #msg[hidden] { display: none; }
  #msg b { font-weight: 640; }
  .keys {
    margin: 6px 0 0; padding: 0; list-style: none;
    display: flex; flex-wrap: wrap; gap: 3px;
  }
  .keys li {
    padding: 1px 5px; font-size: 10.5px; font-weight: 500;
    background: color-mix(in srgb, currentColor 12%, transparent);
    border-radius: 3px;
  }
  .note {
    margin: 11px 0 0; padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 11px; color: var(--ink-3);
  }

  .learned { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
  .learned[hidden] { display: none; }
  .learned h2 {
    margin: 0 0 7px;
    font-size: 10.5px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .learned ul { margin: 0; padding: 0; list-style: none; }
  .learned li {
    display: flex; align-items: center; gap: 7px;
    padding: 4px 0;
    border-bottom: 1px solid var(--line);
  }
  .learned li:last-child { border-bottom: 0; }
  .learned .k {
    flex: none; width: 96px;
    font-size: 11px; color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .learned .v {
    flex: 1; min-width: 0;
    font-size: 12px; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .learned .forget {
    flex: none; width: 20px; height: 20px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-3); background: none;
    border: 0; border-radius: 4px; cursor: pointer;
  }
  .learned .forget:hover { background: var(--surface-2); color: var(--ink); }
</style>
</head>
<body>
  <div class="top">
    <h1>JobAgent</h1>
    <span class="host" id="host"></span>
  </div>
  <p class="sub" id="sub">Checking this page…</p>

  <button id="fill" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/>
    </svg>
    Fill this application
  </button>
  <button class="ghost" id="reload">Reload profile from JobAgent</button>

  <div id="msg" hidden></div>

  <section class="learned" id="learned" hidden>
    <h2 id="learnedTitle">Remembered from your applications</h2>
    <ul id="learnedList"></ul>
  </section>

  <p class="note">Learns the fields you fill in by hand, so the next
     application is already filled. Never reads passwords, IDs, or essays —
     and never submits.</p>

  <script src="popup.js"></script>
</body>
</html>
